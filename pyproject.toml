[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obsidian-thing"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "starlette>=0.40,<2", "uvicorn>=0.31,<1", "pyyaml>=6,<7"]

[project.scripts]
obsidian-thing = "obsidian_thing.__main__:main"

[dependency-groups]
dev = ["httpx2", "pytest>=8,<10"]

[tool.hatch.version]
path = "VERSION"
pattern = '(?P<version>\S+)'

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "docs", "pyproject.toml", "uv.lock", "VERSION", "README.md", "config.example.toml"]
